name: Verify 0.7.0 on Android

on:
  push:
    branches:
      - codex/verify-v0.7.0-android

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Android test device
        shell: bash
        run: |
          test -c /dev/kvm
          pack_java="${JAVA_HOME_17_X64:-}"
          if [[ -z "$pack_java" && -n "${JAVA_HOME:-}" && -x "$JAVA_HOME/bin/javac" ]]; then
            pack_java="$JAVA_HOME"
          fi
          if [[ -z "$pack_java" ]]; then
            pack_java="$RUNNER_TEMP/pack-jdk17"
            mkdir -p "$pack_java"
            curl -fLsS --retry 2 https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse -o "$RUNNER_TEMP/jdk17.tar.gz"
            tar -xzf "$RUNNER_TEMP/jdk17.tar.gz" -C "$pack_java" --strip-components=1
          fi
          export JAVA_HOME="$pack_java"
          export PATH="$JAVA_HOME/bin:$PATH"
          pack_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$RUNNER_TEMP/pack-sdk}}"
          pack_cli="$pack_sdk/cmdline-tools/latest/bin"
          if [[ ! -x "$pack_cli/sdkmanager" ]]; then
            mkdir -p "$pack_sdk/cmdline-tools"
            curl -fLsS --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o "$RUNNER_TEMP/pack-cli.zip"
            unzip -q "$RUNNER_TEMP/pack-cli.zip" -d "$RUNNER_TEMP/pack-cli"
            mv "$RUNNER_TEMP/pack-cli/cmdline-tools" "$pack_sdk/cmdline-tools/latest"
          fi
          export ANDROID_HOME="$pack_sdk" ANDROID_SDK_ROOT="$pack_sdk"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/pack-avd"
          mkdir -p "$ANDROID_AVD_HOME"
          set +o pipefail
          yes | "$pack_cli/sdkmanager" --sdk_root="$pack_sdk" --licenses
          set -o pipefail
          "$pack_cli/sdkmanager" --sdk_root="$pack_sdk" --install emulator platform-tools 'platforms;android-36' 'build-tools;35.0.0' 'system-images;android-35;google_apis;x86_64'
          printf 'no\n' | "$pack_cli/avdmanager" create avd --name pack35 --package 'system-images;android-35;google_apis;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/pack35.avd"
          test -s "$ANDROID_AVD_HOME/pack35.ini"
          printf '%s\n' "JAVA_HOME=$JAVA_HOME" "ANDROID_HOME=$pack_sdk" "ANDROID_SDK_ROOT=$pack_sdk" "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          printf '%s\n' "$JAVA_HOME/bin" "$pack_sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Verify upgrade, instrumentation and Google Drive PDF rendering
        shell: bash
        run: |
          mkdir -p /tmp/pack-qa
          pack_emulator="$ANDROID_HOME/emulator/emulator"
          pack_options=(-avd pack35 -no-window -no-snapshot -no-audio -no-boot-anim -no-metrics -gpu swiftshader_indirect -accel on)
          adb start-server
          ls -l /dev/kvm
          df -h "$RUNNER_TEMP"
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            test "$(stat -c %G /dev/kvm)" = kvm
            sudo -n /usr/sbin/usermod -aG kvm "$(id -un)"
            sg kvm -c "$(printf '%q ' "$pack_emulator" -accel-check)"
            sg kvm -c "$(printf '%q ' env "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" "$pack_emulator" "${pack_options[@]}")" > /tmp/pack-qa/emulator.log 2>&1 &
          else
            "$pack_emulator" -accel-check
            "$pack_emulator" "${pack_options[@]}" > /tmp/pack-qa/emulator.log 2>&1 &
          fi
          pack_emulator_pid=$!
          trap 'grep -ivE "adb.pubkey|adb public key" /tmp/pack-qa/emulator.log | tail -35; adb emu kill || true' EXIT
          for pack_attempt in {1..40}; do
            if adb devices | grep -q '^emulator-'; then break; fi
            kill -0 "$pack_emulator_pid"
            sleep 1
          done
          adb devices | grep '^emulator-'
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
          timeout 180 adb wait-for-device
          timeout 180 bash -c 'until [[ $(adb shell getprop sys.boot_completed | tr -d "\r") = 1 ]]; do sleep 3; done'
          adb shell sm list-volumes all
          adb shell wm density 320
          adb shell wm size 720x1520
          adb shell wm dismiss-keyguard
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r downloads/GPT-Screenshot-Pack-0.6.1.apk
          adb install -r downloads/GPT-Screenshot-Pack-0.7.0.apk
          adb shell dumpsys package com.gptscreenshotpack | grep -E 'versionCode=8|versionName=0.7.0|pkgFlags='
          adb uninstall com.gptscreenshotpack
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell am instrument -w -r com.gptscreenshotpack.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/pack-qa/instrumentation.txt
          pack_pdf_path=/sdcard/Android/data/com.gptscreenshotpack/files/verification/pdf-output.pdf
          if ! adb pull "$pack_pdf_path" /tmp/pack-qa/android-export.pdf; then
            adb exec-out run-as com.gptscreenshotpack cat "$pack_pdf_path" > /tmp/pack-qa/android-export.pdf
          fi
          stat -c 'Generated PDF: %s bytes' /tmp/pack-qa/android-export.pdf
          pack_downloads=content://media/external_primary/downloads
          pack_title=GPT-Screenshot-Pack-verify.pdf
          adb shell "content insert --uri $pack_downloads --bind _display_name:s:$pack_title --bind mime_type:s:application/pdf --bind relative_path:s:Download/"
          pack_row=$(adb shell "content query --uri $pack_downloads --projection _id --where \"_display_name='$pack_title'\"")
          pack_id=$(printf '%s\n' "$pack_row" | sed -n 's/.*_id=\([0-9][0-9]*\).*/\1/p' | tail -1)
          test -n "$pack_id"
          adb shell -T "content write --uri $pack_downloads/$pack_id" < /tmp/pack-qa/android-export.pdf
          adb shell am start -W -a android.intent.action.VIEW -d "$pack_downloads/$pack_id" -t application/pdf --grant-read-uri-permission -p com.google.android.apps.docs
          sleep 4
          adb shell dumpsys activity activities | grep -E '(topResumedActivity|mResumedActivity).*PdfViewerActivity'
          adb exec-out screencap -p > /tmp/pack-qa/google-drive-reader.png
          adb exec-out screencap > /tmp/pack-drive-preview.raw
          python3 - <<'PY'
          from pathlib import Path
          from struct import unpack_from

          raw = Path("/tmp/pack-drive-preview.raw").read_bytes()
          width, height, pixel_format = unpack_from("<III", raw)
          offset = len(raw) - width * height * 4
          assert pixel_format in (1, 2) and offset in (12, 16), (width, height, pixel_format, offset)
          image = raw[offset:]
          red = sum(r >= 230 and g < 30 and b < 30 for r, g, b in zip(image[::4], image[1::4], image[2::4]))
          assert red > 5000, red
          print(f"Google Drive PDF viewer rendered the first page ({red} red pixels).")
          PY
          grep -q '^OK (13 tests)' /tmp/pack-qa/instrumentation.txt
